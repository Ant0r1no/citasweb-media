name: Revisar clave de Instagram

on:
  schedule:
    - cron: "17 8 * * 1"     # lunes por la mañana
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar y renovar la clave
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # La clave es un identificador de sistema de Meta (no caduca): solo se comprueba que sigue funcionando
          ok=$(curl -s "https://graph.facebook.com/v26.0/17841421655402110?fields=username&access_token=$IG_ACCESS_TOKEN" | python3 -c "import sys,json; print('ok' if 'username' in json.load(sys.stdin) else 'bad')")
          echo "Resultado: $ok"
          if [ "$ok" != "ok" ]; then
            gh issue create -R "$REPO" --title "🔑 La clave de Instagram no funciona" --body "El publicador no puede entrar en Instagram. Hay que generar una clave nueva en Meta for Developers (app CitasWeb Publicador → API de Instagram → Generar identificador) y guardarla en Settings → Secrets and variables → Actions → IG_ACCESS_TOKEN."
          fi
