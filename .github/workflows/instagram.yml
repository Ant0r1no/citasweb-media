name: Publicar en Instagram y Facebook

on:
  push:
    branches: [main]
    paths: ["calendar/instagram.json", "calendar/validar.txt", "publisher/**", ".github/workflows/instagram.yml"]
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 min (UTC); GitHub retrasa o salta muchas, por eso hay también una tarea programada que lo lanza a las horas de publicar
  workflow_dispatch:
    inputs:
      only_id:
        description: "Publicar ahora solo esta entrada (id del calendario). Vacío = lo que toque."
        required: false
      dry_run:
        description: "Simulación (no publica nada)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - name: Publicar lo que toca
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ONLY_ID: ${{ inputs.only_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python publisher/ig_publish.py
      - name: Avisar si algo ha fallado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/ig_problems.md"
          if [ -s "$f" ]; then
            gh issue create --title "⚠️ Instagram: publicación con problemas ($(date +%d/%m))" \
              --body "$(printf 'El publicador de Instagram ha tenido problemas:\n\n'; cat "$f"; printf '\n\nDetalle en calendar/ESTADO.md. Se reintenta solo hasta 3 veces.')"
          fi
